# Supabase free projects pause after 7 days with no activity.
# This pings the database twice a week so Kwata never goes to sleep.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Kwata database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://otemiymlkjuakqpgalwg.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_bjImYZEUvMV-mVHLRXf78A_Gl2_feaK")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
